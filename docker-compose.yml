# Job Radar - local infrastructure

services:

  db:
    image: postgres:16
    restart: always
    
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: noam 
      POSTGRES_DB: jobradar
    
    volumes:
        - pgdata:/var/lib/postgresql/data

    ports:
        - 5432:5432
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U noam"]
        interval: 10s
        timeout: 5s
        retries: 5

